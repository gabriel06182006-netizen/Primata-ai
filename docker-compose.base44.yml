services:
  # One-shot dependency install into a named volume shared by web + api,
  # so both app services run the cloned source with a live-reload dev server.
  deps:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["sh", "-ec", "npm ci --no-audit --no-fund"]

  api:
    image: node:22
    working_dir: /app
    command: ["sh", "-ec", "exec npm run start"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - API_PORT=3001
      - NODE_ENV=development
      - BASE44_PREVIEW_MODE
    env_file:
      - path: /run/base44/app.env
        required: false
    depends_on:
      deps:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/api/plans').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    labels:
      base44.project: Primata AI API
      base44.kind: api

  web:
    image: node:22
    working_dir: /app
    command: ["sh", "-ec", "exec npm run dev -- --host 0.0.0.0 --port 5173"]
    ports:
      - "3000:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - API_PROXY_TARGET=http://api:3001
      - NODE_ENV=development
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
      # Vite >= 6.1 appends this to server.allowedHosts (set by the platform).
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    labels:
      base44.project: Primata AI
      base44.kind: web
      base44.port: 3000

volumes:
  node_modules:
